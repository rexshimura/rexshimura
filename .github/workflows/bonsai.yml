name: Grow Git Bonsai

on:
  schedule:
    - cron: "0 0 * * *" # Grows daily at midnight UTC
  workflow_dispatch:    # Lets you trigger it manually
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: egorthinks/git-bonsai@v1
